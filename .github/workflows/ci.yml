name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NEXTAUTH_SECRET: ci-test-secret-minimum-16-chars-long
  REALTIME_SECRET: ci-realtime-secret-minimum-16-chars
  REALTIME_INTERNAL_URL: http://localhost:3000/api/internal/emit
  REALTIME_SERVICE_URL: http://localhost:3003/emit
  PRINT_WORKER_URL: http://localhost:3004
  DEMO_USERS: 'true'
  COOKIE_SECURE: 'false'

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./db/test.db
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run db:generate
      - run: bun run db:push
      - run: npx tsc --noEmit
      - run: bun run lint

  unit-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./db/test.db
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run db:generate
      - run: bun run db:push
      - run: bun run db:seed || true
      - run: npx vitest run tests/unit/

  realtime-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: cd mini-services/realtime-service && bun install
      - run: cd mini-services/realtime-service && npx tsc --noEmit

  integration-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./db/test-integration.db
      INTEGRATION_BASE_URL: http://127.0.0.1:3099
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run db:generate
      - run: bun run db:push
      - run: bun run db:seed || true

      # A6: Arrancar Next.js como proceso del STEP, separado del test runner
      - name: Start Next.js server
        run: |
          npx next dev -p 3099 &
          echo $! > .next-pid
          echo "Server PID: $(cat .next-pid)"

      # A3: Health check estricto — solo 200 + body.ok === true
      - name: Wait for server health
        run: |
          echo "Waiting for server at http://127.0.0.1:3099/api/health..."
          for i in $(seq 1 60); do
            RESPONSE=$(curl -s http://127.0.0.1:3099/api/health 2>/dev/null || echo "FAILED")
            echo "Attempt $i: $RESPONSE"
            OK=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('ok',''))" 2>/dev/null || echo "")
            if [ "$OK" = "True" ]; then
              echo "Server is healthy!"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become healthy in 120 seconds"
          # A4: Show server logs on failure
          echo "=== Last 20 lines of .next/dev/server.log ==="
          tail -20 .next/dev/server.log 2>/dev/null || echo "No server log found"
          exit 1

      - name: Run integration tests
        run: npx vitest run tests/integration/

      - name: Kill server
        if: always()
        run: |
          if [ -f .next-pid ]; then
            kill $(cat .next-pid) 2>/dev/null || true
          fi
          pkill -f "next dev" 2>/dev/null || true

  build:
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, realtime-service, integration-tests]
    env:
      DATABASE_URL: file:./db/build.db
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run db:generate
      - run: bun run db:push
      - run: bun run build
