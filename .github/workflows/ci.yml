name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:./db/test.db
      NEXTAUTH_SECRET: ci-test-secret-minimum-16-chars-long
      REALTIME_SECRET: ci-realtime-secret-minimum-16-chars
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Push test database
        run: bun run db:push

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

  build:
    runs-on: ubuntu-latest
    needs: test

    env:
      DATABASE_URL: file:./db/build.db
      NEXTAUTH_SECRET: build-secret-minimum-16-chars-long
      REALTIME_SECRET: build-realtime-secret-minimum-16-chars

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Push database
        run: bun run db:push

      - name: Build
        run: bun run build
