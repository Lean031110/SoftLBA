name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./db/test.db
      NEXTAUTH_SECRET: ci-test-secret-minimum-16-chars-long
      REALTIME_SECRET: ci-realtime-secret-minimum-16-chars

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Push test database
        run: bun run db:push

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: bun run lint

  unit-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./db/test.db
      NEXTAUTH_SECRET: ci-test-secret-minimum-16-chars-long
      REALTIME_SECRET: ci-realtime-secret-minimum-16-chars

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Push test database
        run: bun run db:push

      - name: Seed test database
        run: bun run db:seed || true

      - name: Run unit tests
        run: npx vitest run tests/unit/

  realtime-service:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install realtime dependencies
        run: cd mini-services/realtime-service && bun install

      - name: Realtime TypeScript check
        run: cd mini-services/realtime-service && npx tsc --noEmit

  integration-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./db/test-integration.db
      NEXTAUTH_SECRET: ci-test-secret-minimum-16-chars-long
      REALTIME_SECRET: ci-realtime-secret-minimum-16-chars
      DEMO_USERS: 'true'
      COOKIE_SECURE: 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Push integration database
        run: bun run db:push

      - name: Seed integration database
        run: bun run db:seed || true

      - name: Run integration tests
        run: npx vitest run tests/integration/
        timeout-minutes: 5

  build:
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, realtime-service]
    env:
      DATABASE_URL: file:./db/build.db
      NEXTAUTH_SECRET: build-secret-minimum-16-chars-long
      REALTIME_SECRET: build-realtime-secret-minimum-16-chars

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Push database
        run: bun run db:push

      - name: Build
        run: bun run build
